name: Catalog Validation

on:
  pull_request:
    paths:
      - ".claude-plugin/marketplace.json"
      - "templates/**"
      - "README.md"
      - "docs/install.md"
      - "docs/plugins.md"
      - "docs/agent-install-matrix.md"
      - "docs/publishing.md"
      - "docs/publish-readiness-matrix.md"
      - ".github/workflows/catalog-validation.yml"
  push:
    branches: [main]
    paths:
      - ".claude-plugin/marketplace.json"
      - "templates/**"
      - "README.md"
      - "docs/install.md"
      - "docs/plugins.md"
      - "docs/agent-install-matrix.md"
      - "docs/publishing.md"
      - "docs/publish-readiness-matrix.md"
      - ".github/workflows/catalog-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Validate catalog files
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
          python3 -m json.tool templates/plugin.json >/dev/null
          python3 -m json.tool templates/agent-runtime/vscode-mcp.example.json >/dev/null
      - name: Validate marketplace structure
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          data = json.loads(Path('.claude-plugin/marketplace.json').read_text())
          plugins = data.get('plugins')
          planned = data.get('planned_plugins')
          assert isinstance(plugins, list)
          assert isinstance(planned, list)
          names = [p['name'] for p in plugins]
          assert len(names) == len(set(names)), 'duplicate active plugin names'
          required_active = {'kicad-pro', 'easyeda-pro', 'a2amesh'}
          assert required_active.issubset(set(names))
          planned_names = {p['name'] for p in planned}
          assert required_active.isdisjoint(planned_names), 'active plugin also appears as planned'
          for plugin in plugins:
              runtime = plugin.get('runtime_configs')
              assert isinstance(runtime, dict) and runtime
              for key in ['claude_code', 'codex', 'vscode_copilot', 'opencode', 'docs']:
                  assert key in runtime, f"missing {key} for {plugin['name']}"
              assert plugin.get('plugin_manifest', '').endswith('/.claude-plugin/plugin.json')
          raw = Path('templates/agent-runtime/opencode.example.jsonc').read_text()
          clean = re.sub(r',\s*([}\]])', r'\1', raw)
          opencode = json.loads(clean)
          assert isinstance(opencode.get('mcp'), dict) and opencode['mcp']
          matrix = Path('docs/agent-install-matrix.md').read_text()
          for word in ['Claude Code', 'Codex', 'VS Code', 'OpenCode', '@a2amesh/mcp@alpha']:
              assert word in matrix, f'missing {word} in install matrix'
          publishing = Path('docs/publishing.md').read_text()
          for heading in [
              '## Catalog release checklist',
              '### 1. Validate catalog metadata',
              '### 2. Decide whether a planned plugin may become active',
              '### 3. Verify source repository notifications',
              '### 4. Required checks before tagging',
              '### 5. Roll back incorrect marketplace metadata',
          ]:
              assert heading in publishing, f'missing catalog release guidance: {heading}'
          readiness = Path('docs/publish-readiness-matrix.md').read_text()
          assert '`a2amesh`' in readiness and 'Active (local MCP)' in readiness
          readme = Path('README.md').read_text()
          assert '| A2A Mesh | `oaslananka/a2amesh` | Active |' in readme
          print('catalog validation ok')
          PY
